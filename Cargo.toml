[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["jpdevopti"]

[workspace.dependencies]
dofustabs-core = { path = "crates/core" }
dofustabs-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
unicode-normalization = "0.1"
clap = { version = "4", features = ["derive"] }
