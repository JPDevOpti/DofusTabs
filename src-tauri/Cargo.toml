[package]
name = "dofustabs"
version.workspace = true
description = "Multi-account window switcher for Dofus"
authors.workspace = true
edition.workspace = true

[lib]
# Suffix avoids a name clash with the binary crate on Windows (rust-lang/cargo#8519).
name = "dofustabs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
dofustabs-core = { workspace = true }
dofustabs-platform = { workspace = true }
