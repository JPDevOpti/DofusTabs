name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend
        # tauri's generate_context! requires the frontendDist directory to
        # exist, so the frontend must be built before any cargo step.
        run: |
          npm ci
          npm run build

      - name: Test workspace
        run: cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend
        run: |
          npm ci
          npm run build

      # This job is the only compile verification of the cfg(windows) code in
      # dofustabs-platform — the team develops on Linux.
      - name: Check workspace
        run: cargo check --workspace

      - name: Test core and platform
        run: cargo test -p dofustabs-core -p dofustabs-platform
